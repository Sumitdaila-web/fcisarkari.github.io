<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View & Download PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        iframe {
            width: 100%;
            height: 90vh;
            border: 1px solid #ccc;
        }
        .download-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .download-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h2>View PDF</h2>

    <!-- Download Button -->
    <a class="download-btn" href="sample.pdf" download>
        Download PDF
    </a>

    <!-- PDF Viewer -->
    <iframe src="Scan_20260202_150229.pdf"></iframe>

</body>
</html>
